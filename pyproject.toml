[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pribor-ai"
version = "0.1.0"
description = "Source-grounded product drafts using free OpenRouter models"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pribor-ai = "pribor_ai.__main__:main"

[tool.setuptools.packages.find]
include = ["pribor_ai*"]
